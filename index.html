<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Voice Similarity Workspace</title>

    <!-- ReactFlow CSS -->
    <link rel="stylesheet" href="https://unpkg.com/reactflow@11.11.4/dist/base.css" />
    <link rel="stylesheet" href="https://unpkg.com/reactflow@11.11.4/dist/style.css" />

    <!-- Import-map compatibility across browsers -->
    <script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>

    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
          "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
          "reactflow": "https://esm.sh/reactflow@11.11.4",
          "lucide-react": "https://esm.sh/lucide-react@0.451.0"
        }
      }
    </script>

    <style>
      html, body { height: 100%; margin: 0; }
      body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      #root { height: 100vh; }
      .react-flow__attribution { display: none !important; }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- TSX runtime (compiles app.tsx in the browser via CDN) -->
    <script type="module">
      import "https://esm.sh/tsx";
      import "./app.tsx";
    </script>
  </body>
</html>
